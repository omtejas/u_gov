name: U-GOV verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [u_gov_v3, u_gov_v4, u_gov_v6]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Test suite
        run: npm test
